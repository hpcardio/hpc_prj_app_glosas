{% load static %}
<div id="petrobras-followup" class="petrobras-panel" data-base="{% url 'petrobras_bridge' endpoint='status' %}" data-convenio="{{ filtros.convenio }}" data-readonly="{% if request.session.api_user.perfil == 'leitura' %}true{% else %}false{% endif %}">
  <details data-role="controls">
  <summary>Demonstrativos da operadora</summary>
  <div class="petrobras-actions">
    <button type="button" class="btn btn-outline-primary" data-action="refresh">Atualizar consulta</button>
  </div>
  <p class="petrobras-help">Consulte os demonstrativos importados ou sincronize uma competência e acompanhe os retornos da operadora.</p>
  <div class="petrobras-actions">
    <label>Competência <input type="month" class="form-control" data-role="competencia"></label>
    <button type="button" class="btn btn-outline-primary" data-action="discover">Importar competência</button>
    <label>Protocolo <select class="form-select" data-role="protocol"><option value="">Selecione</option></select></label>
    <button type="button" class="btn btn-primary" data-action="sync">Sincronizar protocolo</button>
    <label>Outro protocolo <input class="form-control" data-role="new-protocol" maxlength="12"></label>
    <button type="button" class="btn btn-outline-primary" data-action="add-protocol">Adicionar</button>
  </div>
  <div data-role="runs"></div>
  <form data-role="filters" class="petrobras-filters">
    <label>Guia <input name="guia" class="form-control" maxlength="100" value="{{ filtros.nr_guia }}"></label>
    <label>TUSS <input name="tuss" class="form-control" maxlength="20"></label>
    <label>Cruzamento <select name="cruzamento" class="form-select"><option value="">Todos</option><option value="conciliado">Conciliado</option><option value="nao_localizado">Não localizado no Oracle</option><option value="ambiguo">Correspondência ambígua</option><option value="dados_insuficientes">Dados insuficientes</option></select></label>
    <label>Recurso <select name="recurso" class="form-select"><option value="">Todos</option><option value="rascunho">Rascunho</option><option value="protocolado">Protocolado</option><option value="em_analise">Em análise</option><option value="respondido">Respondido</option><option value="envio_incerto">Envio não confirmado</option><option value="transmitindo">Transmissão iniciada</option></select></label>
    <label>Prazo até <input name="prazo_ate" type="date" class="form-control"></label>
    <button class="btn btn-primary">Filtrar demonstrativos</button>
  </form>
  </details>
  <form hidden>{% csrf_token %}</form>
</div>
<link rel="stylesheet" href="{% static 'css/petrobras-followup.css' %}?v=20261030-hierarchy">
<script src="{% static 'js/petrobras-followup.js' %}?v=20261030-hierarchy" defer></script>
