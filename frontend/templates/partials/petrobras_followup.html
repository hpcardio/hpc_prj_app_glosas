{% load static %}
<div id="petrobras-followup" class="petrobras-panel" data-base="{% url 'petrobras_bridge' endpoint='status' %}" data-convenio="{{ filtros.convenio }}" data-readonly="{% if request.session.api_user.perfil == 'leitura' %}true{% else %}false{% endif %}">
  <details data-role="controls">
  <summary>Integração Petrobras</summary>
  <p class="petrobras-help">Os demonstrativos importados aparecem na lista de glosas abaixo, junto aos demais convênios. Use os controles para buscar novos retornos da operadora.</p>
  <div class="petrobras-actions">
    <label>Competência <input type="month" class="form-control" data-role="competencia"></label>
    <button type="button" class="btn btn-outline-primary" data-action="discover">Importar competência</button>
    <label>Protocolo <select class="form-select" data-role="protocol"><option value="">Selecione</option></select></label>
    <button type="button" class="btn btn-primary" data-action="sync">Sincronizar protocolo</button>
    <label>Outro protocolo <input class="form-control" data-role="new-protocol" maxlength="12"></label>
    <button type="button" class="btn btn-outline-primary" data-action="add-protocol">Adicionar</button>
    <button type="button" class="btn btn-outline-primary" data-action="match-all">Conferir todos no MV Sistema</button>
  </div>
  <p data-role="message" role="status" aria-live="polite"></p>
  <div data-role="runs"></div>
  </details>
  <form hidden>{% csrf_token %}</form>
</div>
<dialog id="petrobras-item-dialog" class="petrobras-dialog" aria-labelledby="petrobras-item-title">
  <div class="petrobras-dialog-header">
    <h2 id="petrobras-item-title" data-role="dialog-title">Recurso pela integração Petrobras</h2>
    <button type="button" class="btn btn-outline-primary" data-dialog-close>Fechar</button>
  </div>
  <p data-role="dialog-message" role="status" aria-live="polite"></p>
  <div data-role="dialog-body" class="petrobras-card petrobras-dialog-body"></div>
</dialog>
<link rel="stylesheet" href="{% static 'css/petrobras-followup.css' %}?v=20261102-mv">
<script src="{% static 'js/petrobras-followup.js' %}?v=20261102-mv" defer></script>
