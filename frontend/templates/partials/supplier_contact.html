{% load core_extras %}
<section id="cadastro"><div class="su-section-head"><div><h2>Cadastro e contato</h2><p>Responsável, canais de comunicação e próxima ação.</p></div></div>
<form method="post" class="su-grid">{% csrf_token %}<input type="hidden" name="action" value="save_contact"><input type="hidden" name="version" value="{{ case.version }}">
<label>Responsável no fornecedor<input name="contact" value="{{ case.contact.contact }}" maxlength="150"></label><label>E-mail<input type="email" name="email" value="{{ case.contact.email }}" maxlength="254"></label><label>Telefone<input name="phone" value="{{ case.contact.phone }}" maxlength="30"></label><label>WhatsApp com DDD<input name="whatsapp" value="{{ case.contact.whatsapp }}" maxlength="30"></label><label>Responsável interno<input name="responsible" value="{{ case.responsible }}" maxlength="150"></label><label>Data da próxima ação<input type="date" name="next_date" value="{{ case.next_date|default:'' }}"></label><label class="su-span2">Próxima ação<textarea name="next_action" maxlength="2000" rows="2">{{ case.next_action }}</textarea></label><div class="su-actions"><button class="su-btn">Salvar contato</button></div></form></section>
